[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orch-it"
version = "0.0.0"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["psutil>=5.9"]  # the one cross-platform reading of the process tree (#395 decision 3)

[project.optional-dependencies]
test = ["pytest>=8", "actionlint-py>=1.7"]  # actionlint-py: the workflow linter, run by the `tests` workflow and tests/test_workflow_lint.py

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orch_it = ["events/*.json", "events/*.sql", "events/queries/*.sql", "labels/*.json", "roles/*.json", "shipped/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --ignore=tests/fixtures"
markers = [
    "slow: long; the workflow leaves it out of pull request and push runs (#394 decision 8)",
    "live: reads a live outside service; the workflow leaves it out of pull request and push runs",
]
