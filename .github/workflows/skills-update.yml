name: skills-update

# Daily and on demand (#397 decision 4): compare his upstream with the repo's skill copies and, on a
# change, keep one pull request with the new copies and every skill's class. The log's last line is
# `no change`, `pull request: <url> ...`, `pull request already open: <url> ...` or `pull request
# closed unmerged ...`. A pull request opened with this workflow's token starts no workflow, so the
# update asks for the `tests` workflow on its branch by name (`--dispatch-tests`). The repo must let
# Actions create pull requests and allow auto-merge.
on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

concurrency:
  group: skills-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: skills update
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m orch_it skills update --repo "$REPO" --dispatch-tests
