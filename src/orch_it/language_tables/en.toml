# English: the strings orch-it writes to a human. Same keys as every other table.

# The shape check of a ticket (src/orch_it/tickets/shape.py): the rule for the human block's language.
human_field_language_rule = "the text of each human field is English"
# A character class matching the letters of this language's script; the check counts them. It tests the script, not the
# language: text in another language of the same script passes, and only text mostly in another script is refused.
human_field_letters = "[A-Za-z]"
# A regex (word boundaries included) of the Undo field's fixed words; the check leaves them out, they are the form, not text.
undo_words = '\b(?:two-way door|one-way door|one revert|touches)\b'
